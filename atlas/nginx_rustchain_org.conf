server {
    listen 80;
    server_name rustchain.org www.rustchain.org;

    # ... Existing proxy rules ...
    
    # NEW: Beacon Atlas reverse proxy routes
    # Keep the /beacon/ prefix when proxying.  A trailing slash on proxy_pass
    # would rewrite /beacon/atlas to /atlas and make the Flask route 404.
    # For UI/API: rustchain.org/beacon/* -> 127.0.0.1:8071/beacon/*
    location /beacon/ {
        proxy_pass http://127.0.0.1:8071;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
